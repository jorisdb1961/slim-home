<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1020">
<title>Darts Party</title>
<style>
  :root { --bg: #0b1020; --panel: #151c33; --panel2: #1d2745; --text: #f2f5ff; --dim: #9aa6c8; --ok: #2ecc71; --bad: #ff4d5e; --gold: #ffd60a; --line: #2a3558; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 18px/1.35 -apple-system, "Segoe UI", Roboto, sans-serif; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  body { padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(16px, env(safe-area-inset-left)); }
  main { width: 100%; max-width: 1000px; margin: 0 auto; padding: 14px 0 28px; }
  h1 { margin: 6px 0 2px; font-size: 34px; letter-spacing: .5px; }
  .sub { color: var(--dim); margin: 0 0 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin-bottom: 12px; }
  label.row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; display: inline-block; }
  input, select { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; -webkit-user-select: text; user-select: text; }
  input { flex: 1; }
  select { flex: none; max-width: 52%; }
  .seg { display: flex; gap: 8px; flex-wrap: wrap; }
  .seg button { flex: 1; min-width: 70px; }
  button { font: inherit; font-weight: 700; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 14px; padding: 13px 16px; cursor: pointer; }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .35; }
  button.on { background: var(--gold); color: #1a1500; border-color: var(--gold); }
  button.big { font-size: 22px; padding: 18px; width: 100%; }
  button.go { background: var(--ok); border-color: var(--ok); color: #04210f; }
  button.bad { background: var(--bad); border-color: var(--bad); color: #fff; }
  .ghost { background: transparent; color: var(--dim); font-weight: 500; }
  small.k { display: block; color: var(--dim); text-transform: uppercase; letter-spacing: 1.5px; font-size: 12px; margin-bottom: 6px; }
  details { margin: 6px 0 12px; color: var(--dim); } summary { cursor: pointer; padding: 6px 0; } details p { margin: 6px 0; color: var(--text); font-size: 16px; }
  .hub { display: grid; gap: 12px; }
  .hub button { text-align: left; padding: 18px; display: flex; gap: 14px; align-items: center; }
  .hub .em { font-size: 40px; } .hub b { font-size: 22px; display: block; } .hub span.d { font-weight: 400; color: var(--dim); font-size: 15px; }
  .cols { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  .cols > .l { flex: 1 1 340px; min-width: 0; } .cols > .r { flex: 1 1 320px; min-width: 0; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; } .topbar b { color: var(--dim); font-weight: 600; }
  /* missie */
  .board { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { flex: 1 1 130px; background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 8px 10px; min-width: 0; }
  .chip.me { border-color: var(--c); box-shadow: 0 0 0 2px var(--c) inset, 0 0 18px -4px var(--c); }
  .chip.dead { opacity: .4; text-decoration: line-through; }
  .chip .n { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
  .chip .n i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
  .chip .s { font-size: 26px; font-weight: 800; line-height: 1.1; }
  .pips { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 3px; min-height: 10px; }
  .pips b { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
  .pips b.y { background: var(--ok); } .pips b.n { background: var(--bad); }
  .stage { --c: #fff; }
  .who { text-align: center; font-size: 24px; font-weight: 800; color: var(--c); }
  .who span { color: var(--dim); font-weight: 500; font-size: 17px; display: block; }
  .mission { background: var(--panel); border: 2px solid var(--c); border-radius: 26px; padding: 26px 20px; margin: 12px 0; text-align: center; font-size: clamp(28px, 6.2vw, 52px); font-weight: 800; line-height: 1.15; box-shadow: 0 0 40px -14px var(--c); }
  .mission .pr { display: block; margin-top: 12px; font-size: 15px; font-weight: 500; color: var(--dim); }
  .actions { display: flex; gap: 12px; } .actions button { flex: 1; }
  .bar { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  /* gooi-invoer */
  .pad { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 12px; }
  .darts { display: flex; gap: 8px; margin-bottom: 10px; }
  .darts div { flex: 1; text-align: center; padding: 10px 0; border-radius: 12px; background: var(--panel2); color: var(--dim); font-weight: 800; font-size: 20px; }
  .darts div.f { color: var(--text); background: #2c3a68; }
  .mults { display: flex; gap: 8px; margin-bottom: 8px; } .mults button { flex: 1; padding: 11px 4px; }
  .nums { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
  .nums button { padding: 14px 0; font-size: 21px; }
  .nums button.w2 { grid-column: span 2; }
  .tn { background: var(--panel); border: 2px solid var(--c); border-radius: 18px; padding: 12px 14px; margin-bottom: 12px; font-size: 16px; }
  .tn b { color: var(--text); } .tn .big2 { font-size: 22px; font-weight: 800; color: var(--c); display: block; margin-bottom: 4px; }
  .tn .log { color: var(--gold); margin-top: 4px; font-weight: 600; }
  /* killer */
  .kcard { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 16px; background: var(--panel); border: 2px solid var(--line); margin-bottom: 8px; }
  .kcard.me { border-color: var(--c); box-shadow: 0 0 22px -6px var(--c); }
  .kcard.dead { opacity: .4; } .kcard.dead .nm { text-decoration: line-through; }
  .kcard .num { font-size: 40px; font-weight: 900; color: var(--c); min-width: 64px; text-align: center; line-height: 1; }
  .kcard .nm { font-weight: 700; } .kcard .st { margin-left: auto; font-size: 26px; letter-spacing: 3px; white-space: nowrap; }
  .kcard .st .e { opacity: .25; filter: grayscale(1); }
  /* tycoon */
  .toast { position: fixed; left: 50%; top: 18%; transform: translateX(-50%) scale(.8); max-width: 92vw; text-align: center; font-size: 30px; font-weight: 900; padding: 14px 24px; border-radius: 20px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .25s; z-index: 5; }
  .toast.show { opacity: 1; transform: translateX(-50%) scale(1); }
  .toast.ok { background: var(--ok); color: #04210f; } .toast.bad { background: var(--bad); color: #fff; } .toast.info { background: var(--gold); color: #1a1500; }
  .rank { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; background: var(--panel2); margin-bottom: 8px; font-size: 22px; }
  .rank.w { background: var(--gold); color: #1a1500; font-weight: 800; } .rank .sc { margin-left: auto; font-weight: 800; }
  /* ---------- Monopoly: zelfde uiterlijk als de overlay ---------- */
  body.ty { background: radial-gradient(1200px 800px at 30% 40%, #141c30 0%, #080b12 70%); font-family: "Bahnschrift", "Segoe UI", system-ui, sans-serif; }
  main.wide { max-width: 1600px; padding: 10px 0; }
  .tyapp { display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 470px); gap: 22px; align-items: center; min-height: calc(100vh - 20px); }
  .tystage { position: relative; padding-top: 58px; min-width: 0; }
  #tyhead { position: absolute; left: 0; right: 0; top: 4px; display: flex; justify-content: center; z-index: 3; }
  .tturn { padding: 7px 22px; border-radius: 99px; background: rgba(10,14,22,.9); border: 2px solid var(--tc); font-size: clamp(15px, 2.2vw, 26px); white-space: nowrap; box-shadow: 0 0 30px -8px var(--tc); display: flex; align-items: center; gap: 12px; max-width: 100%; }
  .tturn > span:first-child { overflow: hidden; text-overflow: ellipsis; } .tturn b { color: var(--tc); }
  .darts3 { display: flex; gap: 6px; padding-left: 12px; border-left: 2px solid rgba(255,255,255,.18); }
  .dart-ic { width: 40px; height: 18px; } .dart-ic .fill { fill: rgba(255,255,255,.12); stroke: rgba(255,255,255,.3); stroke-width: 1; } .dart-ic.on .fill { fill: var(--tc); stroke: #fff; } .dart-ic.on { animation: pop .3s ease-out; }
  @keyframes pop { from { transform: scale(.6); } to { transform: scale(1); } }
  .tgt.pulse { animation: tgt 1.1s ease-in-out infinite; } @keyframes tgt { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  .tytools { position: fixed; top: 10px; right: 14px; z-index: 20; } .tytools button { width: 42px; height: 42px; padding: 0; border-radius: 50%; background: rgba(18,24,38,.88); font-size: 18px; }
  .boardwrap { position: relative; width: min(100%, calc(100vh - 96px)); aspect-ratio: 1; margin: 0 auto; filter: drop-shadow(0 20px 50px rgba(0,0,0,.6)); }
  .boardwrap > svg { display: block; width: 100%; height: 100%; }
  .pawn { transition: transform .16s linear; }
  /* de bediening in het midden van het bord */
  .tycenter { position: absolute; left: 13.5%; top: 13.5%; width: 73%; height: 73%; container-type: inline-size; }
  .cin { height: 100%; display: flex; flex-direction: column; gap: 1.6cqw; padding: 1.6cqw; font-size: 4.4cqw; }
  .tycenter button { font-size: 1em; padding: 0 1cqw; border-radius: 2cqw; background: rgba(8,14,26,.82); border: .35cqw solid rgba(255,255,255,.16); color: #fff; font-weight: 800; }
  .chead { display: flex; gap: 1.6cqw; height: 13cqw; flex: none; }
  .cp { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; border-radius: 2.4cqw; background: rgba(0,0,0,.34); border: .5cqw dashed rgba(255,255,255,.2); color: rgba(255,255,255,.55); min-width: 0; }
  .cp b { font-size: 1.15em; } .cp span { font-size: .6em; opacity: .85; }
  .cp.on { background: var(--tc); border: .5cqw solid transparent; color: #07101a; animation: pop .35s ease-out; }
  .ctot { width: 17cqw; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 2.4cqw; background: rgba(0,0,0,.45); border: .5cqw solid var(--tc); line-height: 1; }
  .ctot b { font-size: 1.7em; } .ctot span { font-size: .52em; color: #aab6cc; margin-top: .6cqw; }
  #cmode { width: 11cqw; flex: none; font-size: 1.3em; }
  .cmid { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 1.6cqw; justify-content: center; align-items: center; }
  .cmid.pad { align-items: stretch; justify-content: stretch; }
  .cmults { display: flex; gap: 1.6cqw; height: 10cqw; flex: none; } .cmults button { flex: 1; }
  .cnums { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(5, 1fr); gap: 1.4cqw; }
  .cnums button { grid-column: span 2; font-size: 1.15em; } .cnums button.w3 { grid-column: span 5; }
  .tycenter button.on { background: #ffd84d; color: #1a1500; border-color: #ffd84d; }
  .tycenter button.tg { box-shadow: 0 0 0 .6cqw #fff inset, 0 0 3cqw #fff; animation: tgt 1.1s ease-in-out infinite; }
  .tycenter button:disabled { opacity: .3; }
  #cb { height: 100%; max-width: 100%; aspect-ratio: 1; cursor: crosshair; touch-action: manipulation; }
  .cfoot { display: flex; gap: 1.6cqw; height: 10cqw; flex: none; } .cfoot button { flex: 1; font-size: .9em; }
  /* spelerskaarten */
  .tyside { display: flex; flex-direction: column; gap: 12px; justify-content: center; min-width: 0; }
  .tcard { --accent: #2ee6a6; background: rgba(22,28,42,.78); border: 1px solid rgba(255,255,255,.1); border-left: 6px solid var(--accent); border-radius: 20px; padding: 14px 20px 12px; opacity: .55; transition: transform .3s, box-shadow .3s, opacity .3s; }
  .tcard.active { opacity: 1; transform: translateX(-8px); box-shadow: 0 0 44px -10px var(--accent), 0 14px 40px rgba(0,0,0,.4); }
  .ttop { display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 700; }
  .ttag { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--accent); color: #07101a; letter-spacing: .08em; }
  .tnow { display: none; margin-left: auto; font-size: 12px; letter-spacing: .1em; padding: 4px 12px; border-radius: 99px; background: var(--accent); color: #07101a; animation: blink 1.3s ease-in-out infinite; }
  .tcard.active .tnow { display: inline-block; } @keyframes blink { 50% { opacity: .55; } }
  .tpoints { font-size: 92px; line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums; margin: 2px 0 4px; letter-spacing: -.02em; }
  .tsub { color: #8a96ab; font-size: 15px; margin: 0 0 8px; min-height: 20px; }
  .tthrow { display: flex; align-items: stretch; gap: 10px; margin: 4px 0; } .tpills { display: flex; gap: 8px; flex: 1; }
  .tpill { flex: 1; min-height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; border-radius: 14px; background: rgba(255,255,255,.05); border: 2px dashed rgba(255,255,255,.14); color: #8a96ab; min-width: 0; }
  .tpill b { font-size: 26px; font-weight: 800; } .tpill span { font-size: 14px; opacity: .8; margin-top: 3px; }
  .tpill.on { background: var(--accent); border-style: solid; border-color: transparent; color: #07101a; animation: pop .35s ease-out; }
  .ttotal { min-width: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 14px; background: rgba(0,0,0,.3); border: 2px solid var(--accent); padding: 4px 10px; }
  .ttotal b { font-size: 46px; line-height: 1; font-variant-numeric: tabular-nums; } .ttotal span { font-size: 12px; color: #8a96ab; text-transform: uppercase; letter-spacing: .06em; text-align: center; margin-top: 2px; }
  .tnext { font-size: 16px; min-height: 22px; margin: 6px 0 0; color: #dfe7f3; } .tnext b { color: var(--accent); }
  .tstats { display: flex; margin-top: 8px; font-size: 12px; color: #8a96ab; text-transform: uppercase; letter-spacing: .06em; } .tstats div { flex: 1; } .tstats b { display: block; font-size: 22px; color: #f1f5fb; letter-spacing: 0; }
  .tmini { display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-radius: 14px; background: rgba(22,28,42,.78); border: 1px solid rgba(255,255,255,.1); border-left: 5px solid var(--accent); opacity: .88; font-size: 20px; }
  .tmini .mn { font-weight: 700; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .tmini .mv { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; } .tmini .mex { font-size: 14px; color: #8a96ab; }
  .tmini.dead { opacity: .35; filter: grayscale(1); }
  .tyside.many .tcard { padding: 10px 18px 8px; } .tyside.many .tpoints { font-size: 64px; margin: 0; } .tyside.many .tpill { min-height: 48px; } .tyside.many .tpill b { font-size: 20px; } .tyside.many .ttotal b { font-size: 34px; } .tyside.many .tstats { display: none; }
  @media (max-width: 900px) {                                                /* telefoon / staand: bord bovenaan, daaronder de kaarten */
    .tyapp { grid-template-columns: 1fr; gap: 12px; min-height: 0; } .tystage { padding-top: 52px; } .boardwrap { width: 100%; }
    .tyside { flex-direction: row; flex-wrap: wrap; } .tcard { flex: 1 1 100%; transform: none !important; } .tmini { flex: 1 1 calc(50% - 10px); min-width: 0; font-size: 16px; } .tmini .mv { font-size: 22px; }
    .tpoints { font-size: 64px; } .tcard.active { transform: none; }
  }
  @media (max-width: 640px) {
    .boardwrap { aspect-ratio: auto; } .boardwrap > svg { height: auto; aspect-ratio: 1; }                                                /* heel smal: de bediening onder het bord, dan zijn de knoppen groot genoeg */
    .tycenter { position: static; width: 100%; height: auto; margin-top: 10px; background: rgba(22,28,42,.78); border-radius: 18px; } .cin { height: auto; font-size: 4.2cqw; }
    .cmid.pad { flex: none; } .cnums { grid-template-rows: repeat(5, 11.5cqw); } #cb { width: 100%; height: auto; }
    .tturn { font-size: 14px; padding: 5px 12px; }
  }
  .misbox { --tc: #fff; background: rgba(10,14,22,.92); border: 3px solid var(--tc); border-radius: 28px; padding: 22px 26px; text-align: center; font-size: clamp(30px, 5.2vw, 66px); font-weight: 800; line-height: 1.12; box-shadow: 0 0 46px -10px var(--tc); min-height: 38vh; display: flex; flex-direction: column; justify-content: center; }
  .misbox small { display: block; font-size: 16px; color: #8a96ab; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 8px; } .misbox em { display: block; font-style: normal; font-size: 16px; font-weight: 500; color: #8a96ab; margin-top: 14px; }
  .misact { display: flex; gap: 14px; margin-top: 14px; } .misact button { flex: 1; } .misbar { display: flex; justify-content: space-between; margin-top: 8px; }
  .mis-dots { display: flex; gap: 6px; margin: 2px 0 8px; flex-wrap: wrap; } .mis-dots i { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,.14); } .mis-dots i.y { background: #2ee6a6; box-shadow: 0 0 6px #2ee6a6; } .mis-dots i.n { background: #ff4d5e; }
  .tmini .mis-dots { margin: 0; gap: 3px; } .tmini .mis-dots i { width: 8px; height: 8px; }
  .kwrap { width: min(100%, calc(100vh - 200px)); aspect-ratio: 1; margin: 0 auto; filter: drop-shadow(0 20px 50px rgba(0,0,0,.6)); } .kwrap.small { width: min(100%, calc(100vh - 470px)); min-width: 260px; }
  .kwrap svg { display: block; width: 100%; height: 100%; cursor: crosshair; }
  .tycenter.kpadc { position: static; width: 100%; height: auto; margin-top: 10px; background: rgba(22,28,42,.78); border-radius: 18px; max-width: 760px; margin-left: auto; margin-right: auto; } .kpadc .cin { height: auto; font-size: 3.4cqw; } .kpadc .cnums { grid-template-rows: repeat(5, 8cqw); }
  .kl-row { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; } .kl-row.dead { opacity: .3; filter: grayscale(1); } .kl-row svg { overflow: visible; }
  .skull-on { filter: drop-shadow(0 0 4px #ff4d5e); animation: skullp 1.4s ease-in-out infinite; } @keyframes skullp { 50% { filter: drop-shadow(0 0 10px #ff4d5e); } }
  .tcard.dead { opacity: .35; filter: grayscale(1); }
  .tytools button.big { width: auto; }
  .misact button.big { border-radius: 99px; font-size: 24px; } .misact button.go { color: #05140d; }
  @media (max-width: 520px) { body { font-size: 16px; } .mission { padding: 18px 14px; } .toast { font-size: 24px; } }
</style>
</head>
<body>

<script>

const ORDER = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];

const pol = (r, deg) => { const a = deg * Math.PI / 180; return [r * Math.sin(a), -r * Math.cos(a)]; };

function segCenter(num, mult) {                                  // plek in mm (y omhoog) in het midden van het geraakte vak; voor darts zonder echte coördinaten (bijv. de bot)
  if (num === 25) return mult === 2 ? [0, 0] : [0, 11];

function spot(r, others = []) {                                  // een willekeurige plek op het bord, niet te dicht bij andere doelen
  for (let k = 0; k < 40; k++) { const rr = 18 + r() * 85, an = r() * 6.283, x = rr * Math.cos(an), y = rr * Math.sin(an); if (others.every(o => Math.hypot(o.x - x, o.y - y) > 52)) return { x: Math.round(x), y: Math.round(y) }; }
  return { x: 0, y: 0 };
}
const tRad = (r, c) => Math.max(15, Math.round(c.sigma * (.8 + r() * .9)));
T('tgt1', 3, (r, A, c) => ({ e: pk(r, EMOJIS), ...spot(r), rad: tRad(r, c) }), P => ({ text: `Raak de ${P.e}`, targets: [{ e: P.e, x: P.x, y: P.y, r: P.rad }], check: ds => ds.some(d => hitTarget(d, { x: P.x, y: P.y, r: P.rad })), aim: () => [P.x, P.y] }), { need: ctxCoords, lo: .12 });

  P => { const ts = [{ e: P.e1, x: P.a.x, y: P.a.y, r: P.rad }, { e: P.e2, x: P.b.x, y: P.b.y, r: P.rad }]; return { text: `Raak de ${P.e1} én de ${P.e2}`, targets: ts, check: ds => hitsAll(ds, ts), aim: k => k === 0 ? [ts[0].x, ts[0].y] : k === 1 ? [ts[1].x, ts[1].y] : [0, 103] }; }, { need: ctxCoords, lo: .06 });

  P => { const ts = P.ps.map((p, i) => ({ e: P.es[i], x: p.x, y: p.y, r: P.rad })); return { text: `Raak alle drie: ${P.es.join(' ')}`, targets: ts, check: full(ds => hitsAll(ds, ts)), aim: k => [ts[k].x, ts[k].y] }; }, { need: ctxCoords, lo: .03 });

    return { text: '😀 Raak beide ogen en de mond', targets: ts, check: full(ds => hitsAll(ds, ts)), aim: k => [ts[k].x, ts[k].y],

// Kies een opdracht voor "houder" h (een speler of een team): { idx, g: { ptr, round }, team? } met context c (zie missionCtx).
// Vast per zaad (SEED), speler en ronde, dus herhaalbaar. Elk sjabloon komt eerst één keer langs voordat er een herhaling is.
function pickMission(h, c) {
  const g = h.g, order = shuffleSeeded(MT.map(t => t.id), SEED * 31 + ((h.idx || 0) + 1) * 977);
  for (let n = 0; n < order.length; n++) {
    const t = MT_BY_ID[order[(g.ptr + n) % order.length]];
    if (t.need && !t.need(c)) continue;
    for (let a = 0; a < 5; a++) {
      const r = rng(hashStr(`${SEED}|${h.idx || 0}|${g.round}|${t.id}|${a}`));
      const P = t.draw(r, c.A, c);
      if (t.id === 'beatPrev' || t.id === 'lessPrev' || t.id === 'nearPrev') P.T = c.prev;
